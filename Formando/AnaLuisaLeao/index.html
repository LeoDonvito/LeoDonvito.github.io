<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite de Formatura CEPMG</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        .font-serif {
            font-family: 'Cormorant Garamond', serif;
        }
        .font-sans {
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #111111;
            background-image: radial-gradient(circle at center, #1c1c1c 0%, #111111 70%);
            color: #e0e0e0;
            overflow-x: hidden; 
        }

        .text-gold {
            color: #D4AF37; 
        }
        .bg-gold {
            background-color: #D4AF37;
        }
        .border-gold {
            border-color: #D4AF37;
        }

        .text-gold-gradient {
            background: linear-gradient(to right, #D4AF37, #FFD700, #D4AF37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        .divider-gold {
            height: 1px; 
            width: 150px; 
            margin: 3rem auto; 
            background: linear-gradient(to right, transparent, rgba(212, 175, 55, 0.5), transparent);
        }

        .reveal-hidden {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        .reveal-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .reveal-scale-hidden {
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 1s ease-out, transform 1s ease-out;
        }
        .reveal-scale-visible {
            opacity: 1;
            transform: scale(1);
        }

        @keyframes fadeInContent {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .fade-in-content {
            animation: fadeInContent 1.5s ease-out forwards;
        }

        .hero-glow {
            box-shadow: 0 0 100px 50px rgba(212, 175, 55, 0.05);
        }

        .countdown-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100px;
            height: 100px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(5px);
        }
        .countdown-number {
            font-size: 2.5rem; 
            font-weight: 700;
            line-height: 1;
        }
        .countdown-label {
            font-size: 0.875rem; 
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #999;
        }
        
        #music-toggle-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 50; 
            background-color: rgba(212, 175, 55, 0.8); 
            backdrop-filter: blur(5px);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            transform: scale(0); 
        }
        #music-toggle-btn.visible {
             transform: scale(1); 
        }
        #music-toggle-btn:hover {
            background-color: rgba(212, 175, 55, 1);
            transform: scale(1.1); 
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }
        .music-playing-pulse {
            animation: pulse 1.5s infinite;
        }

        #music-toggle-btn svg {
            width: 24px;
            height: 24px;
            color: #111111;
        }

        .info-card {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); 
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

            transform: translateY(-5px); 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px
